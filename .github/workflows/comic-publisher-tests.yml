name: Comic Publisher Tests
on:
  push:
    branches: [automation/techops-publisher]
  pull_request:
    paths:
      - scripts/*comic*
      - tests/test_comic*.py
      - tests/publisher-control.test.mjs
      - tests/comic-publisher-pins.test.mjs
      - tests/comic-publication-catalogue.test.mjs
      - scripts/publisher-control.mjs
      - src/data/comic-publication-catalogue.json
      - scripts/finalize-comic-dist.mjs
      - publishing/**
      - .github/workflows/comic-publisher*.yml
      - .github/workflows/pages.yml
      - .github/workflows/import-volume-xiv-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_comic*.py' -v
      - run: node --test tests/publisher-control.test.mjs tests/comic-publisher-pins.test.mjs tests/comic-publication-catalogue.test.mjs
      - name: Validate registered manifests
        run: |
          for manifest in publishing/releases/*.json; do
            python3 scripts/comic-publisher.py check --manifest "$manifest"
          done
      - run: node --check scripts/comic-browser-smoke.mjs
      - name: Lint publisher workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/comic-publisher.yml .github/workflows/comic-publisher-tests.yml .github/workflows/pages.yml .github/workflows/import-volume-xiv-assets.yml
      - name: Build the existing site without publishing any release
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --test tests/comic-corrected-release.test.mjs tests/comic-finalization.test.mjs
          node scripts/finalize-comic-dist.mjs > comic-finalization-receipt.json
          python3 scripts/comic-publisher.py stamp --root dist --commit "$GITHUB_SHA"
