name: Comic Real Provider Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/comic-provider-probe.py'
      - '.github/workflows/comic-provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact candidate
        run: |
          git rev-parse HEAD HEAD^{tree}
          npm ci --no-audit --no-fund
          npm run build
      - name: Install browser runner
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Serve candidate locally
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/comic-provider-preview.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Probe actual provider telemetry
        timeout-minutes: 4
        run: python tests/comic-provider-probe.py
      - name: Retain provider diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-real-provider-probe
          path: qa/comic-provider-probe/
          if-no-files-found: warn
          retention-days: 14
