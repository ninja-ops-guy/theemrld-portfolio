name: See World Origin Pair
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: portfolio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ninja-ops-guy/techops-hero
          ref: 8d3ac165863857a4cf29a4aed6251b347fde0d2f
          path: native
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact candidate commits and trees
        run: |
          mkdir -p origin-proof
          git -C portfolio rev-parse HEAD > origin-proof/portfolio-head.txt
          git -C portfolio rev-parse HEAD^{tree} > origin-proof/portfolio-tree.txt
          git -C native rev-parse HEAD > origin-proof/native-head.txt
          git -C native rev-parse HEAD^{tree} > origin-proof/native-tree.txt
      - name: Verify exact paired reader, origin routing and save contracts
        working-directory: portfolio
        run: TECHOPS_SOURCE=../native node --test scripts/see-world*.test.mjs
      - name: Native production gate
        working-directory: native
        run: npm test
      - name: Build portfolio
        working-directory: portfolio
        run: npm install --no-audit --no-fund && npm run build
      - name: Install isolated test browser
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Exercise production-hostname choices without live writes
        run: python portfolio/scripts/see-world-origin-browser.py
      - name: Exercise same-origin paired save loop
        run: |
          mkdir site
          ln -s "$PWD/native" site/techops-hero
          ln -s "$PWD/portfolio/dist" site/theemrld-portfolio
          python -m http.server 8765 --directory site > server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          LINKED_VERIFY_HUD=1 LINKED_STORY_PATH=/techops-hero/see-world/index.html LINKED_QA_DIR=origin-proof python portfolio/scripts/see-world-linked-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-origin-paired-save-proof
          path: |
            origin-proof/
            server.log
