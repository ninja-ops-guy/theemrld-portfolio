name: Sync Raikouno Releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sync parser
        run: python -m unittest discover -s tests -p 'test_raikouno_sync.py'
      - name: Fetch current SoundCloud RSS and validate dated tracks
        run: python scripts/sync_raikouno.py
      - name: Propose dated catalogue update for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'music: refresh dated @raikouno releases'
          branch: automation/raikouno-releases
          delete-branch: true
          title: 'Music: sync latest @raikouno releases'
          body: 'Generated from the public @raikouno SoundCloud RSS feed. Verify tracks and dates before merging. If RSS is disabled, the workflow fails without modifying the published catalogue.'
          add-paths: public/k-world/latest-releases.json
