name: Comic Full Collection Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/*Comic*'
      - 'src/components/GuidedScoreDialog.tsx'
      - 'src/data/comic-*'
      - 'scripts/finalize-comic-dist.mjs'
      - 'tests/comic-*'
      - 'tests/test_comic_retired_probe.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/comic-final-collection.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/*Comic*'
      - 'src/components/GuidedScoreDialog.tsx'
      - 'src/data/comic-*'
      - 'scripts/finalize-comic-dist.mjs'
      - 'tests/comic-*'
      - '.github/workflows/pages.yml'
      - '.github/workflows/comic-final-collection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and qualify current-only publication
        run: |
          npm install --no-audit --no-fund
          node --test tests/comic-corrected-release.test.mjs tests/comic-finalization.test.mjs tests/k-world-guided*.test.mjs
          npm run build
          node scripts/finalize-comic-dist.mjs > comic-finalization-receipt.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test strict retired comic asset responses
        run: python tests/test_comic_retired_probe.py
      - name: Install browser runner
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Serve exact deployment artifact
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/comic-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/techops-comic/publication.json && exit 0
            sleep 1
          done
          exit 1
      - name: Desktop and mobile-touch acceptance
        env:
          COMIC_BASE_URL: http://127.0.0.1:4173/
          COMIC_QA_DIR: qa/comic-final-local
        run: |
          python tests/comic-final-browser.py
          python tests/comic-final-polish.py
      - name: Await exact production publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for i in {1..36}; do
            if curl -fsSL "https://kterminal.site/techops-comic/publication.json?check=${GITHUB_SHA}" -o live-publication.json && python3 -c 'import json,os; assert json.load(open("live-publication.json"))["sourceCommit"]==os.environ["GITHUB_SHA"]'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify live desktop and mobile-touch readers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMIC_BASE_URL: https://kterminal.site/
          COMIC_QA_DIR: qa/comic-final-live
        run: |
          python tests/comic-final-browser.py
          python tests/comic-final-polish.py
      - name: Retain qualification receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-full-collection-acceptance
          path: |
            qa/comic-final-local/
            qa/comic-final-live/
            comic-finalization-receipt.json
          if-no-files-found: warn
          retention-days: 14
