name: Prepare See World Linked Candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.candidate/**'
      - '.github/workflows/linked-candidate-prepare.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ninja-ops-guy/theemrld-portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/see-world-four-campaigns'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact authored changes and create an unattached commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .candidate/prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-linked-candidate
          path: candidate-evidence/
          retention-days: 7
