name: Portfolio PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test PDF preservation gate
        run: python3 -m unittest discover -s tests -p test_comic_archive_gate.py -v
      - name: TypeScript + Vite build
        run: npm run build
      - name: Verify archive readiness and projected Pages size
        run: python3 scripts/prepare-pages-comic-release.py --verify-only
