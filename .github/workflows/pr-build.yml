name: Portfolio PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript + Vite build
        run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image gate dependency
        run: python -m pip install 'Pillow==12.3.0'
      - name: Verify every source image fully decodes
        run: python scripts/image_asset_gate.py --root public --output qa/image-assets-public.json
