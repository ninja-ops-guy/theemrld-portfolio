name: See World Public Smoke
on:
  workflow_run:
    workflows: ['Deploy portfolio to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-presentation:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated public browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Verify deployed presentation bytes and public navigation
        run: |
          mkdir -p public-proof
          git rev-parse HEAD > public-proof/released-head.txt
          python scripts/see-world-public-smoke.py
      - name: Verify the deployed same-origin linked journey
        env:
          LINKED_BASE_URL: https://kterminal.site
          LINKED_QA_DIR: public-proof/production-linked
        run: python scripts/see-world-production-journey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: see-world-public-presentation-live
          path: public-proof/
          retention-days: 30
