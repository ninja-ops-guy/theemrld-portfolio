name: Deploy portfolio to GitHub Pages
# public Pages publish trigger

on:
  push:
    branches: [main]
    paths-ignore: [publishing/request.json]
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional manifest-bound comic release to verify
        type: string
      expected_sha:
        description: Exact main commit; required for comic publication
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check requested release identity
        env:
          RELEASE: ${{ inputs.release_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os,re
          r=os.environ['RELEASE'];expected=os.environ['EXPECTED_SHA']
          if r and (not re.fullmatch('[a-z0-9][a-z0-9-]{0,79}',r) or expected!=os.environ['GITHUB_SHA']):
              raise SystemExit('Requested release or main commit moved; refuse a stale deployment')
          if expected and expected!=os.environ['GITHUB_SHA']:raise SystemExit('Wrong deployment SHA')
          if os.environ['GITHUB_REF']!='refs/heads/main':raise SystemExit('Deployments must originate from main')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp exact commit and verify comic bytes and site capacity
        env:
          RELEASE: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$RELEASE" ]; then args=(--manifest "publishing/releases/$RELEASE.json"); fi
          python3 scripts/comic-publisher.py stamp --root dist --commit "$GITHUB_SHA" "${args[@]}"

      - name: Install pinned browsers for the actual deployment artifact
        if: inputs.release_id != ''
        run: |
          npm install --prefix browser-tooling --no-audit --no-fund playwright@1.65.0
          node browser-tooling/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Verify the rebuilt reader before uploading it to Pages
        if: inputs.release_id != ''
        env:
          MANIFEST: publishing/releases/${{ inputs.release_id }}.json
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/comic-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.release_id != ''
        with:
          name: deployed-artifact-browser-receipts
          path: browser-receipts
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve small live verifier
        uses: actions/upload-artifact@v4
        with:
          name: comic-live-verifier
          path: |
            scripts/comic-publisher.py
            publishing/releases/*.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed portfolio
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            html="$(curl --max-time 30 -fsSL "$DEPLOY_URL" || true)"
            if echo "$html" | grep -q 'assets/' && ! echo "$html" | grep -q 'src="/src/main.tsx"'; then
              echo "Deployed Vite bundle detected."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages is not serving the built Vite artifact." >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: comic-live-verifier
          path: verifier
      - name: Verify live exact commit and every declared release file
        env:
          RELEASE: ${{ inputs.release_id }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          release=os.environ['RELEASE'];url=os.environ['DEPLOY_URL'].rstrip('/')+'/'
          command=['python3','verifier/scripts/comic-publisher.py','live','--url',url,'--commit',os.environ['GITHUB_SHA']]
          if release:command += ['--manifest','verifier/publishing/releases/'+release+'.json']
          result=subprocess.run(command)
          receipt={'status':('PUBLISHED_HASH_VERIFIED' if release else 'SITE_COMMIT_VERIFIED') if result.returncode==0 else 'LIVE_VERIFICATION_FAILED',
            'release_id':release or None,'commit':os.environ['GITHUB_SHA'],'url':url,'physical_mobile_test':False}
          pathlib.Path('publisher-live-receipt.json').write_text(json.dumps(receipt,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## '+receipt['status']+'\n\nCommit: '+receipt['commit']+'\n')
          raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-live-receipt
          path: publisher-live-receipt.json
          if-no-files-found: warn
          retention-days: 90
