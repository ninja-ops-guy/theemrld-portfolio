name: Deploy portfolio to GitHub Pages
# public Pages publish trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Quality preflight
        run: |
          npm run build
          npm run lint

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed portfolio
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in {1..12}; do
            html="$(curl -fsSL "$url" || true)"
            if echo "$html" | grep -q 'assets/' && ! echo "$html" | grep -q 'src="/src/main.tsx"'; then
              echo "Deployed Vite bundle detected."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages is not serving the built Vite artifact." >&2
          exit 1
