name: Deploy portfolio to GitHub Pages
run-name: ${{ inputs.release_id && format('Comic deployment · {0} · {1}', inputs.release_id, inputs.expected_sha) || github.workflow }}
# public Pages publish trigger

on:
  push:
    branches: [main]
    paths-ignore: [publishing/request.json]
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact registered revision to verify
        type: string
      expected_sha:
        description: Exact main commit required for a comic release
        type: string
      manifest_sha256:
        description: Exact approved manifest hash
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

env:
  TECHOPS_COMMIT: da94b84bcf0a08c2f11fa6af156af3e16444a099

jobs:
  build:
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest is now 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact TechOps Hero companion
        uses: actions/checkout@v4
        with:
          repository: ninja-ops-guy/techops-hero
          ref: ${{ env.TECHOPS_COMMIT }}
          path: techops-hero
          persist-credentials: false
      - name: Check exact release and deployment identity
        env:
          RELEASE: ${{ inputs.release_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MANIFEST_HASH: ${{ inputs.manifest_sha256 }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,re
          release=os.environ['RELEASE'];expected=os.environ['EXPECTED_SHA']
          if os.environ['GITHUB_REF']!='refs/heads/main':raise SystemExit('Deploy only from main')
          if expected and expected!=os.environ['GITHUB_SHA']:raise SystemExit('STALE_DEPLOYMENT: main changed')
          if release:
              if not re.fullmatch('[a-z0-9][a-z0-9-]{0,79}',release) or not expected:raise SystemExit('Release identity and exact SHA required')
              raw=pathlib.Path('publishing/releases/'+release+'.json').read_bytes()
              if hashlib.sha256(raw).hexdigest()!=os.environ['MANIFEST_HASH']:raise SystemExit('Manifest changed')
              if json.loads(raw).get('lifecycle')=='retired':raise SystemExit('Retired release')
          PYCODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify and package exact same-origin TechOps Hero
        env:
          TECHOPS_SOURCE: techops-hero
        run: |
          node --test scripts/see-world.test.mjs scripts/see-world-linked.test.mjs scripts/see-world-recovery.test.mjs scripts/see-world-publication.test.mjs
          (cd techops-hero && node scripts/production_release_gate.js)
          node scripts/package-techops-hero.mjs --source techops-hero --portfolio . --out dist/techops-hero --commit "$TECHOPS_COMMIT"
      - name: Publish current comic books only
        run: |
          node --test tests/comic-corrected-release.test.mjs tests/comic-finalization.test.mjs
          node scripts/finalize-comic-dist.mjs > comic-finalization-receipt.json
          cat comic-finalization-receipt.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image gate dependency
        run: python -m pip install 'Pillow==12.3.0'
      - name: Verify every deployed image fully decodes
        run: python scripts/image_asset_gate.py --root dist --output qa/image-assets-dist.json
      - name: Retain image-integrity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-asset-receipt
          path: qa/image-assets-dist.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify approved immutable source and stamp exact deployment
        if: inputs.release_id != ''
        env:
          RELEASE: ${{ inputs.release_id }}
        run: python3 scripts/comic-publisher.py stamp --root dist --commit "$GITHUB_SHA" --manifest "publishing/releases/$RELEASE.json"
      - name: Install browser verification
        if: inputs.release_id != ''
        run: |
          npm install --prefix browser-tooling --no-audit --no-fund playwright@1.65.0
          node browser-tooling/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Verify rebuilt reader before deployment
        if: inputs.release_id != ''
        env:
          MANIFEST: publishing/releases/${{ inputs.release_id }}.json
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/comic-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.release_id != ''
        with:
          name: publisher-browser-receipts
          path: browser-receipts
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: inputs.release_id != ''
        with:
          name: publisher-verifier
          path: |
            scripts/comic-publisher.py
            scripts/publisher-control.mjs
            publishing/releases/*.json
          retention-days: 90
      - name: Retain expected publication
        uses: actions/upload-artifact@v4
        with:
          name: expected-comic-publication
          path: dist/techops-comic/publication.json
      - name: Retain publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: comic-finalization-receipt
          path: comic-finalization-receipt.json
      - name: Setup linked-journey browser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linked-journey browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Verify exact same-origin candidate before deployment
        env:
          LINKED_BASE_URL: http://127.0.0.1:4173
          LINKED_QA_DIR: qa/production-linked-candidate
        run: |
          set -euo pipefail
          python - <<'PY' > linked-candidate-server.log 2>&1 &
          import mimetypes
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          mimetypes.add_type('text/javascript', '.mjs')
          handler = partial(SimpleHTTPRequestHandler, directory='dist')
          with ThreadingHTTPServer(('127.0.0.1', 4173), handler) as server:
              server.serve_forever()
          PY
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/techops-hero/ >/dev/null 2>&1; then
              python scripts/see-world-production-journey.py
              exit 0
            fi
            kill -0 "$server" 2>/dev/null || break
            sleep 1
          done
          cat linked-candidate-server.log >&2
          printf '%s\n' 'The same-origin preview did not serve /techops-hero/.' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-origin-linked-candidate
          path: qa/production-linked-candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: expected-comic-publication
          path: expected-publication
      - name: Smoke test exact deployed publication
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsSL "${SITE_URL%/}/techops-comic/publication.json?check=${GITHUB_SHA}" -o publication.json && python3 -c 'import json,os; p=json.load(open("publication.json")); assert p["sourceCommit"]==os.environ["GITHUB_SHA"]; assert p["earlierEditionsPublic"] is False; expected=json.load(open("expected-publication/publication.json")); assert p==expected'; then
              break
            fi
            if [ "$i" = 18 ]; then exit 1; fi
            sleep 10
          done
          # GitHub Pages' Varnish edge occasionally emits a short-lived 503
          # for paths that really are retired (404). Never accept a 503 as a
          # retirement proof: retry at most twice, then fail the deployment gate.
          for asset in TechOps-Hero-Revision-11.pdf TechOps-Hero-Revision-11.1.pdf TechOps-Hero-Revision-F-Complete.pdf revision-f/001.webp volume-xiii/001.webp; do
            for attempt in 1 2 3; do
              code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${SITE_URL%/}/techops-comic/${asset}?retired=${GITHUB_SHA}")" || {
                echo "Retired asset transport failure: $asset"
                exit 1
              }
              if [ "$code" = 404 ] || [ "$code" = 410 ]; then break; fi
              if [ "$code" = 503 ] && [ "$attempt" -lt 3 ]; then
                echo "::warning::Transient Pages edge 503 on retired asset: $asset (attempt $attempt); retrying"
                sleep "$attempt"
                continue
              fi
              echo "Retired asset not confirmed absent: $asset (HTTP $code; attempt $attempt)"
              exit 1
            done
          done
          echo 'Exact current publication and retired-asset removal verified.'

      - uses: actions/download-artifact@v4
        if: inputs.release_id != ''
        with:
          name: publisher-verifier
          path: verifier
      - name: Verify live exact release and every declared byte
        if: inputs.release_id != ''
        env:
          RELEASE: ${{ inputs.release_id }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess
          release=os.environ['RELEASE'];url=os.environ['SITE_URL'].rstrip('/')+'/'
          result=subprocess.run(['python3','verifier/scripts/comic-publisher.py','live','--manifest','verifier/publishing/releases/'+release+'.json','--url',url,'--commit',os.environ['GITHUB_SHA']])
          receipt={'status':'PUBLISHED_HASH_VERIFIED' if result.returncode==0 else 'LIVE_VERIFICATION_FAILED','release_id':release,'commit':os.environ['GITHUB_SHA'],'url':url,'physical_mobile_test':False}
          pathlib.Path('publisher-live-receipt.json').write_text(json.dumps(receipt,indent=2))
          raise SystemExit(result.returncode)
          PYCODE
      - name: Persist verified completion independently of chat and artifact expiry
        if: inputs.release_id != ''
        uses: actions/github-script@v7
        env:
          RELEASE: ${{ inputs.release_id }}
          MANIFEST_HASH: ${{ inputs.manifest_sha256 }}
        with:
          script: |
            const fs=require('fs');
            const c=await import(`${process.env.GITHUB_WORKSPACE}/verifier/scripts/publisher-control.mjs`);
            const receipt=JSON.parse(fs.readFileSync('publisher-live-receipt.json'));
            await c.recordLiveReceipt(github,context.repo,process.env.RELEASE,process.env.MANIFEST_HASH,context.sha,receipt,context.runId);
            await core.summary.addHeading(receipt.status).addRaw(`Release: ${receipt.release}; commit: ${context.sha}. Emulated browser tests are not physical-device certification.`).write();
      - uses: actions/upload-artifact@v4
        if: always() && inputs.release_id != ''
        with:
          name: publisher-live-receipt
          path: publisher-live-receipt.json
          if-no-files-found: warn
          retention-days: 90
