name: Publish corrected comic media 2026-11-10

on:
  push:
    branches: [release/techops-corrected-media-20261110]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrected-comic-publication-20261110
  cancel-in-progress: false

jobs:
  publish-media-and-prepare-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF and image validators
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 Pillow==12.3.0
      - name: Fetch exact reviewed publication bundle
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/publisher.zip" 'https://d2ol7oe51mr4n9.cloudfront.net/user_3KUGKm6rb5ZYG1d6wZeiyLW1uHj/8e2fa12c-f411-4931-8e13-6182bdda68c0.zip'
          echo "4b1c9d8d951b7b1463df09eeb90f123a42ff45005a55886dab9142a394ce17f6  $RUNNER_TEMP/publisher.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/techops-publisher"
          python -m zipfile -e "$RUNNER_TEMP/publisher.zip" "$RUNNER_TEMP/techops-publisher"
      - name: Verify originals, publish immutable media, and test additive reader
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: python "$RUNNER_TEMP/techops-publisher/publish.py"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-comic-publication-evidence
          path: |
            ${{ runner.temp }}/techops-corrected-publication/current-editions.json
            ${{ runner.temp }}/techops-corrected-publication/media/COMIC_MEDIA_RECEIPT.json
            docs/COMIC_CORRECTED_PUBLICATION_QA.json
          if-no-files-found: warn
          retention-days: 30
