name: Native WebKit issue 101 graphics resource isolation
on:
  push:
    branches: [qa/native-webkit-101-graphics-isolation]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - condition: default-rendering
            playwright: '1.57.0'
            lifecycle: shared
          - condition: cpu-tiles
            playwright: '1.57.0'
            lifecycle: shared
          - condition: cpu-rendering
            playwright: '1.57.0'
            lifecycle: shared
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ninja-ops-guy/theemrld-portfolio
          ref: 14a3df8e1a77ca2ad3329b43828671f69226ce77
          path: portfolio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ninja-ops-guy/techops-hero
          ref: 053ee3948170ac972bc1af44eacfa4857fc32a0f
          path: native
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned engine and telemetry
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb binutils
          python -m pip install "playwright==$PLAYWRIGHT_VERSION" 'psutil==7.0.0' 
          python -m playwright install --with-deps webkit
      - name: Test failure handling against original negative control
        run: |
          mkdir -p original
          git -C diagnostics fetch --depth=1 origin caeac5b05672262a3557e7eea0c88f850b15e1f0
          for file in startup.py instrumentation.py sampler.js; do
            git -C diagnostics show "caeac5b05672262a3557e7eea0c88f850b15e1f0:scripts/issue-101/$file" > "original/$file"
          done
          ISSUE101_ORIGINAL_STARTUP="$PWD/original/startup.py" python diagnostics/scripts/issue-101/test_startup.py
      - name: Verify sources and serve
        run: |
          mkdir -p results web
          test "$(git -C native rev-parse HEAD)" = 053ee3948170ac972bc1af44eacfa4857fc32a0f
          test "$(git -C portfolio rev-parse HEAD)" = 14a3df8e1a77ca2ad3329b43828671f69226ce77
          git -C native rev-parse HEAD > results/native-head.txt
          git -C portfolio rev-parse HEAD > results/portfolio-head.txt
          git -C diagnostics rev-parse HEAD > results/diagnostic-head.txt
          cp /etc/os-release results/os-release.txt
          python -m pip freeze > results/python-packages.txt
          sha256sum diagnostics/scripts/issue-101/* > results/source-sha256.txt
          cp -r diagnostics/scripts/issue-101 results/source
          ln -s "$PWD/native" web/techops-hero
          ln -s "$PWD/portfolio/public" web/theemrld-portfolio
          nohup python -m http.server 8765 --bind 127.0.0.1 --directory web > results/server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/techops-hero/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Execute native-only reproducer once
        timeout-minutes: 9
        env:
          LIFECYCLE: ${{ matrix.lifecycle }}
          GRAPHICS_CONDITION: ${{ matrix.condition }}
          QA_CAPTURE_GRAPHICS_ENV: '1'
          QA_ENGINE: webkit
          QA_BASE: http://127.0.0.1:8765
          QA_OUTPUT: results/browser
          DEBUG: pw:browser
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          unset WEBKIT_SKIA_ENABLE_CPU_RENDERING WEBKIT_SKIA_GPU_PAINTING_THREADS WEBKIT_SKIA_CPU_PAINTING_THREADS
          case "$GRAPHICS_CONDITION" in
            default-rendering) ;;
            cpu-tiles) export WEBKIT_SKIA_GPU_PAINTING_THREADS=0 ;;
            cpu-rendering) export WEBKIT_SKIA_ENABLE_CPU_RENDERING=1 ;;
            *) exit 2 ;;
          esac
          python -c 'import os,json; keys=["GRAPHICS_CONDITION","WEBKIT_SKIA_ENABLE_CPU_RENDERING","WEBKIT_SKIA_GPU_PAINTING_THREADS","WEBKIT_SKIA_CPU_PAINTING_THREADS"]; print(json.dumps({k:os.environ.get(k) for k in keys},indent=2))' > results/graphics-environment.json
          ulimit -c 0
          ulimit -a > results/limits.txt
          set +e
          timeout --signal=TERM --kill-after=15s 480s python diagnostics/scripts/issue-101/startup.py --count 96 --telemetry off --lifecycle "$LIFECYCLE" > results/case-output.log 2>results/browser-process.log
          rc=$?
          echo "$rc" > results/command-exit.txt
          exit "$rc"
      - name: Retain engine identity and available stacks
        if: always()
        timeout-minutes: 4
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          mkdir -p cores
          bash diagnostics/scripts/issue-101/collect-stacks.sh
          df -h > results/disk-after.txt
      - name: Retain available kernel evidence
        if: always()
        run: |
          mkdir -p results
          dmesg > results/dmesg.txt 2>&1 || true
          journalctl -k --no-pager > results/kernel-journal.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webkit-101-graphics-${{ matrix.condition }}
          path: results/
          retention-days: 30
          if-no-files-found: error
