name: See World Navigation Repair
on:
  pull_request:
    paths:
      - 'src/pages/MediaLinks.tsx'
      - 'public/techops-hero/**'
      - 'scripts/see-world-public-smoke.py'
      - 'scripts/see-world-native-provenance.json'
      - 'tests/see-world-navigation.test.mjs'
      - '.github/workflows/see-world-navigation.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build candidate
        run: |
          mkdir -p public-proof
          git rev-parse HEAD > public-proof/candidate-head.txt
          git rev-parse HEAD^{tree} > public-proof/candidate-tree.txt
          node --test tests/see-world-navigation.test.mjs
          python -m py_compile scripts/see-world-public-smoke.py
          npm ci --no-audit --no-fund
          npm run build
      - name: Install isolated browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check candidate navigation with live native provenance
        env:
          SMOKE_CANDIDATE_DIST: dist
        run: timeout --signal=TERM --kill-after=10s 7m python -u scripts/see-world-public-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: see-world-navigation-candidate
          path: public-proof/
          retention-days: 14
