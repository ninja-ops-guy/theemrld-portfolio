<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The dedicated K Terminal domain opens the console by default.
      // Preserve explicit hash routes so links to the comic, city, and other pages still work.
      (function () {
        var host = window.location.hostname.toLowerCase();
        var hash = window.location.hash;
        if ((host === 'kterminal.site' || host === 'www.kterminal.site') &&
            (window.location.pathname === '/' || window.location.pathname === '/index.html') &&
            (hash === '' || hash === '#' || hash === '#/')) {
          window.location.replace(window.location.pathname + window.location.search + '#/terminal');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K Terminal — Music, Comics & Worlds</title>
    <meta name="description" content="Listen to original music, read TechOps Hero, and explore See World and K World — the creative universe of Defied Stars." />
    <meta name="author" content="Mike Olivares" />
    <meta name="theme-color" content="#050A14" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="K Terminal — Music, Comics & Worlds" />
    <meta property="og:description" content="Original music, the TechOps Hero comic, and connected interactive worlds by Defied Stars." />
    <meta property="og:url" content="https://kterminal.site/" />
    <link rel="canonical" href="https://kterminal.site/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="K Terminal — Music, Comics & Worlds" />
    <meta name="twitter:description" content="Original music, the TechOps Hero comic, and connected interactive worlds by Defied Stars." />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"K Terminal","url":"https://kterminal.site/","description":"Original music, TechOps Hero comics, and interactive worlds by Defied Stars.","creator":{"@type":"Person","name":"Mike Olivares"}}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      html,body{margin:0;padding:0} body{background:#050A14;color:#E8EDF3;font-family:'Inter',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased} button{background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;padding:0;margin:0} a{color:inherit;text-decoration:none} img{max-width:100%;display:block}.font-headline{font-family:'Space Grotesk',sans-serif;font-weight:400}.font-label{font-family:'Space Grotesk',sans-serif;font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#8899AA}.font-body{font-family:'Inter',sans-serif;font-weight:300}#root{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root">
      <main id="boot-status" style="min-height:100vh;background:#050A14;color:#E8EDF3;font-family:Inter,system-ui,sans-serif;padding:8vh 7vw;box-sizing:border-box">
        <p style="font-family:monospace;letter-spacing:.14em;color:#8899AA;font-size:11px">DEFIED STARS // MUSIC // COMICS // WORLDS</p>
        <h1 style="font-family:system-ui,sans-serif;font-weight:500;font-size:clamp(42px,8vw,96px);line-height:.92;max-width:1050px;margin:24px 0">K TERMINAL</h1>
        <p style="color:#A8B5C4;line-height:1.7;font-size:18px;max-width:820px">Listen to original music, read the TechOps Hero comic, and explore its connected worlds.</p>
        <p style="color:#66788C;line-height:1.7;font-size:13px;max-width:760px;margin-top:34px"><a href="/music/">Music</a> · <a href="/comic/">TechOps Hero</a> · <a href="/about/">Explore the worlds</a> · <a href="/portfolio/">Engineering portfolio</a> · <a href="/privacy/">Privacy</a></p>
        <noscript><p style="margin-top:40px;color:#9AAEFF">JavaScript is required for the interactive terminal. The links above describe the music, comic, worlds, and portfolio.</p></noscript>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && document.getElementById('boot-status')) {
          root.innerHTML = '<div style="min-height:100vh;padding:40px;background:#050A14;color:#E8EDF3;font-family:monospace"><h1 style="font-size:18px">K TERMINAL BOOT ERROR</h1><pre style="white-space:pre-wrap;color:#8899AA">' + String(event.message || 'Unknown runtime error').replace(/[&<>]/g, '') + '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        if (root && document.getElementById('boot-status')) {
          root.innerHTML = '<div style="min-height:100vh;padding:40px;background:#050A14;color:#E8EDF3;font-family:monospace"><h1 style="font-size:18px">K TERMINAL LOAD ERROR</h1><pre style="white-space:pre-wrap;color:#8899AA">' + String(event.reason || 'Unknown promise rejection').replace(/[&<>]/g, '') + '</pre></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
